[package]
name = "aliasmode-desktop"
version = "0.1.0-beta.71"
description = "AliasMode Windows desktop shell"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
default-run = "aliasmode"

[lib]
name = "aliasmode_desktop"
crate-type = ["rlib"]

[[bin]]
name = "aliasmode"
path = "src/main.rs"

# Keeps the installed MCP helper path; the helper code runs inside the sidecar program.
[[bin]]
name = "aliasmode-mcp"
path = "src/bin/aliasmode-mcp.rs"

[build-dependencies]
serde_json = "1.0.145"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
hex = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls-no-alpn"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["native-tls", "zip"] }
tokio = { version = "1.48.0", features = ["sync", "time"] }
url = "2.5.7"
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

# The Linux update unpacks the app folder itself; the updater already uses both crates.
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.1.9"
tar = "0.4.46"

[patch.crates-io]
tauri-plugin-updater = { path = "../vendor/tauri-plugin-updater" }

[dev-dependencies]
tempfile = "3.23.0"
