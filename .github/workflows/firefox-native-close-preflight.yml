name: Firefox native close compiled preflight
on:
  push:
    branches: [fix/firefox-native-close-runtime]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'playwright==1.58.0'
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: AliasModeBuilds-macos-arm64
          path: artifacts/firefox
          github-token: ${{ github.token }}
          repository: aliasmode/aliasmode-firefox
          run-id: '38060990891'
      - name: Verify compiled candidate and previous runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/artifacts/firefox/aliasmode-152.0.4-beta.30-mac.arm64.zip"
          printf '%s  %s\n' a9847893bbe0472114cfc35b9f67ecb741f9a59002ac7d9e867634594792d320 "$archive" | shasum -a 256 --check
          ditto -x -k "$archive" "$RUNNER_TEMP/firefox-candidate"
          browser="$RUNNER_TEMP/firefox-candidate/AliasMode.app/Contents/MacOS/aliasmode"
          printf '%s  %s\n' 20e2f8c93457eaf5cbd73a2580d1abdf436fbe54894e14fa7dc69469c1925ee9 "$browser" | shasum -a 256 --check
          printf 'FIREFOX_PREFLIGHT_BINARY=%s\n' "$browser" >> "$GITHUB_ENV"
          printf 'FIREFOX_PREFLIGHT_SHA256=%s\n' 20e2f8c93457eaf5cbd73a2580d1abdf436fbe54894e14fa7dc69469c1925ee9 >> "$GITHUB_ENV"
          previous="$RUNNER_TEMP/previous-firefox.zip"
          curl -fLsS 'https://github.com/aliasmode/aliasmode-firefox/releases/download/aliasmode-runtime-152.0.4-beta.30-r1/aliasmode-152.0.4-beta.30-mac.arm64.zip' -o "$previous"
          printf '%s  %s\n' fc2cf78d13f91e65772b99f3c059dd4ddc6f951c7b9c5bd3c4cc5bfbeb8db2ca "$previous" | shasum -a 256 --check
          ditto -x -k "$previous" "$RUNNER_TEMP/previous-firefox"
          previous_browser="$RUNNER_TEMP/previous-firefox/AliasMode.app/Contents/MacOS/aliasmode"
          printf '%s  %s\n' 5180e6170bb467755a2816f24586a9a5f6ab02a3336e8e0b2df9a58185b2e61d "$previous_browser" | shasum -a 256 --check
          printf 'FIREFOX_PREVIOUS_BINARY=%s\n' "$previous_browser" >> "$GITHUB_ENV"
      - name: Verify native close and reopen
        run: bun scripts/firefox-launcher-acceptance.ts "$FIREFOX_PREFLIGHT_BINARY" "$RUNNER_TEMP/native-close-proof" "$FIREFOX_PREFLIGHT_SHA256"
      - name: Verify windowless capture, focus, and profile upgrade
        run: node scripts/firefox-compatibility-smoke.mjs "$FIREFOX_PREFLIGHT_BINARY" "$RUNNER_TEMP/windowless-proof" --headed --native-ui --previous-browser "$FIREFOX_PREVIOUS_BINARY"
