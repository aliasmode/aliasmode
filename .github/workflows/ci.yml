name: Client CI

on:
  push:
    branches: [main, feature/aliasmode-agent-integration]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - name: Warm Bun baseline compiler cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $warm = Join-Path $env:USERPROFILE "aliasmode-bun-target"
          Remove-Item $warm -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $warm | Out-Null
          Set-Content (Join-Path $warm "entry.ts") "process.exit(0);"
          Push-Location $warm
          try {
            bun build --compile --target=bun-windows-x64-baseline entry.ts --outfile warm.exe
            if ($LASTEXITCODE -ne 0) { throw "Bun baseline compiler cache warm-up failed" }
          } finally {
            Pop-Location
            Remove-Item $warm -Recurse -Force -ErrorAction SilentlyContinue
          }
      - run: bun run desktop:prepare
      - run: bun test
      - run: bun run typecheck
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: bun run rust:test
      - name: Smoke-test compiled sidecar CDP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "aliasmode-sidecar-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item ".\src-tauri\binaries\aliasmode-sidecar-x86_64-pc-windows-msvc.exe" "$smoke\aliasmode-sidecar.exe"
          $metadata = Get-Content ".\src-tauri\generated\browser.json" | ConvertFrom-Json
          $browserPath = Resolve-Path (Join-Path ".\src-tauri\resources\cloakbrowser" $metadata.executable)
          $env:ALIASMODE_PLAYWRIGHT_RUNTIME = (Resolve-Path ".\src-tauri\resources\playwright").Path
          $browser = Start-Process -PassThru $browserPath -ArgumentList @(
            "--headless=new",
            "--disable-gpu",
            "--no-first-run",
            "--remote-debugging-port=9222",
            "--user-data-dir=$smoke\browser-profile"
          )
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-RestMethod "http://127.0.0.1:9222/json/version" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "CloakBrowser CDP endpoint did not become ready" }
            Push-Location $smoke
            try {
              & ".\aliasmode-sidecar.exe" __sidecar-smoke --cdp-endpoint "http://127.0.0.1:9222" --state-root "$smoke\state"
              if ($LASTEXITCODE -ne 0) { throw "compiled sidecar smoke exited with code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          } finally {
            if (-not $browser.HasExited) {
              Stop-Process -Id $browser.Id -Force
              Wait-Process -Id $browser.Id -ErrorAction SilentlyContinue
            }
          }
          $env:CLOAKBROWSER_BINARY_PATH = $browserPath.Path
          $env:CLOAKBROWSER_BINARY_SHA256 = $metadata.sha256
          $env:ALIASMODE_SESSION_LAUNCH = "0"
          Push-Location $smoke
          try {
            & ".\aliasmode-sidecar.exe" __cloud-launcher-smoke --headless --state-root "$smoke\cloud-state"
            if ($LASTEXITCODE -ne 0) { throw "Cloud launcher smoke exited with code $LASTEXITCODE" }
            & ".\aliasmode-sidecar.exe" __cloud-launcher-smoke --proxy-mismatch --headless --state-root "$smoke\proxy-mismatch-state"
            if ($LASTEXITCODE -ne 0) { throw "deterministic proxy mismatch smoke exited with code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - name: Smoke-test authenticated Cloud proxies
        shell: pwsh
        env:
          ALIASMODE_LIVE_PROXY_HOST: ${{ secrets.ALIASMODE_LIVE_PROXY_HOST }}
          ALIASMODE_LIVE_PROXY_PORT: ${{ secrets.ALIASMODE_LIVE_PROXY_PORT }}
          ALIASMODE_LIVE_PROXY_USER: ${{ secrets.ALIASMODE_LIVE_PROXY_USER }}
          ALIASMODE_LIVE_PROXY_PASS: ${{ secrets.ALIASMODE_LIVE_PROXY_PASS }}
          ALIASMODE_LIVE_PROXY_IP: ${{ secrets.ALIASMODE_LIVE_PROXY_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:ALIASMODE_LIVE_PROXY_HOST)) {
            Write-Host "Authenticated Cloud proxy smoke skipped: no temporary test proxy configured"
            exit 0
          }
          $metadata = Get-Content ".\src-tauri\generated\browser.json" | ConvertFrom-Json
          $browserPath = Resolve-Path (Join-Path ".\src-tauri\resources\cloakbrowser" $metadata.executable)
          $env:ALIASMODE_LIVE_BROWSER = $browserPath.Path
          $env:ALIASMODE_LIVE_BROWSER_SHA256 = $metadata.sha256
          $env:ALIASMODE_LIVE_HEADFUL = "1"
          bun test --silent proxy-live.test.ts -t "real Cloud lifecycle"
          if ($LASTEXITCODE -ne 0) { throw "authenticated Cloud proxy smoke exited with code $LASTEXITCODE" }
      - run: bunx tauri build --bundles nsis
      - name: Select NSIS installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem ".\src-tauri\target" -Recurse -File -Filter "*.exe" |
            Where-Object { $_.FullName -match "[\\/]bundle[\\/]nsis[\\/]" })
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          "ALIASMODE_NSIS_INSTALLER=$($installers[0].FullName)" | Add-Content $env:GITHUB_ENV
      - name: Smoke-test installed desktop and headful Cloud proxies
        shell: pwsh
        env:
          ALIASMODE_LIVE_PROXY_HOST: ${{ secrets.ALIASMODE_LIVE_PROXY_HOST }}
          ALIASMODE_LIVE_PROXY_PORT: ${{ secrets.ALIASMODE_LIVE_PROXY_PORT }}
          ALIASMODE_LIVE_PROXY_USER: ${{ secrets.ALIASMODE_LIVE_PROXY_USER }}
          ALIASMODE_LIVE_PROXY_PASS: ${{ secrets.ALIASMODE_LIVE_PROXY_PASS }}
          ALIASMODE_LIVE_PROXY_IP: ${{ secrets.ALIASMODE_LIVE_PROXY_IP }}
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:RUNNER_TEMP "aliasmode installed"
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path $installRoot) { throw "installed acceptance root was not clean" }
          $install = Start-Process -Wait -PassThru $env:ALIASMODE_NSIS_INSTALLER -ArgumentList @(
            "/S",
            "/D=$installRoot"
          )
          if ($install.ExitCode -ne 0) { throw "silent NSIS install exited with code $($install.ExitCode)" }

          $appPath = Join-Path $installRoot "AliasMode.exe"
          if (-not (Test-Path $appPath -PathType Leaf)) { throw "installed AliasMode executable is missing" }
          $sidecars = @(Get-ChildItem $installRoot -Recurse -File -Filter "aliasmode-sidecar*.exe")
          if ($sidecars.Count -ne 1) { throw "expected exactly one installed sidecar, found $($sidecars.Count)" }
          $sidecarBytes = [IO.File]::ReadAllBytes($sidecars[0].FullName)
          $sidecarText = [Text.Encoding]::UTF8.GetString($sidecarBytes) + [Text.Encoding]::Unicode.GetString($sidecarBytes)
          foreach ($sourcePath in @($env:GITHUB_WORKSPACE, $env:GITHUB_WORKSPACE.Replace("\", "/"))) {
            if ($sidecarText.IndexOf($sourcePath, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "installed sidecar embeds its source checkout path"
            }
          }
          Remove-Item ".\node_modules" -Recurse -Force
          if (Test-Path ".\node_modules") { throw "checkout node_modules remained available to installed acceptance" }

          $appData = Join-Path $env:APPDATA "com.aliasmode.desktop"
          Remove-Item $appData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $appData | Out-Null
          @{ version = 1; mode = "local"; localAnalytics = $false } |
            ConvertTo-Json -Compress |
            Set-Content (Join-Path $appData "config.json")
          $descriptorPath = Join-Path $appData "agent-runtime.json"
          $lifecycleTrace = Join-Path $env:RUNNER_TEMP "aliasmode-lifecycle.jsonl"
          Remove-Item $lifecycleTrace -Force -ErrorAction SilentlyContinue
          $env:ALIASMODE_CI_DIAGNOSTICS = $lifecycleTrace

          $bundleVersion = (Get-Content ".\src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          $helper = Join-Path $installRoot "aliasmode-mcp.exe"
          $playwrightRuntime = Join-Path $installRoot "playwright"
          $node = Join-Path $playwrightRuntime "node\node.exe"
          $mcpHost = Join-Path $playwrightRuntime "agent\mcp-host.mjs"
          foreach ($path in @(
            $helper,
            $node,
            $mcpHost,
            (Join-Path $playwrightRuntime "agent\playwright-proxy.mjs"),
            (Join-Path $playwrightRuntime "agent\playwright-runner.mjs"),
            (Join-Path $playwrightRuntime "agent\runtime-client.mjs")
          )) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "installed agent runtime file is missing: $path" }
          }
          if ((& $node --version).Trim() -ne "v22.23.2") { throw "installed Node runtime version is incorrect" }
          foreach ($package in @{
            "playwright-core" = "1.58.2"
            "@modelcontextprotocol\sdk" = "1.30.0"
            "@playwright\mcp" = "0.0.56"
            "playwright" = "1.58.0-alpha-2026-01-16"
          }.GetEnumerator()) {
            $manifest = Join-Path $playwrightRuntime "node_modules\$($package.Key)\package.json"
            if (-not (Test-Path $manifest -PathType Leaf)) { throw "installed agent package is missing: $($package.Key)" }
            if ((Get-Content $manifest | ConvertFrom-Json).version -ne $package.Value) {
              throw "installed agent package version is incorrect: $($package.Key)"
            }
          }

          $helperVersion = & $helper version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $helperVersion.ok -or $helperVersion.result.version -ne $bundleVersion) {
            throw "installed agent helper returned an incorrect version"
          }
          $setup = & $helper setup --client generic --yes | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $setup.ok -or $setup.result.clients.Count -ne 0) {
            throw "installed generic MCP setup failed"
          }
          if (
            $setup.result.mcp.command -ne $node -or
            $setup.result.mcp.args.Count -ne 1 -or
            $setup.result.mcp.args[0] -ne $mcpHost -or
            $setup.result.generic.mcpServers.aliasmode.command -ne $node -or
            $setup.result.generic.mcpServers.aliasmode.args[0] -ne $mcpHost
          ) {
            throw "installed generic MCP setup returned incorrect paths"
          }

          $mcpStart = [System.Diagnostics.ProcessStartInfo]::new()
          $mcpStart.FileName = $node
          $mcpStart.ArgumentList.Add($mcpHost)
          $mcpStart.WorkingDirectory = $installRoot
          $mcpStart.UseShellExecute = $false
          $mcpStart.CreateNoWindow = $true
          $mcpStart.RedirectStandardInput = $true
          $mcpStart.RedirectStandardOutput = $true
          $mcp = [System.Diagnostics.Process]::new()
          $mcp.StartInfo = $mcpStart
          if (-not $mcp.Start()) { throw "installed MCP host did not start" }
          $mcpShutdownFailure = $null
          try {
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"aliasmode-ci","version":"1"}}}')
            $initialize = $mcp.StandardOutput.ReadLine() | ConvertFrom-Json
            if ($initialize.id -ne 1 -or -not $initialize.result.serverInfo) {
              throw "installed MCP host returned an invalid initialize response"
            }
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}')
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
            $toolResponse = $mcp.StandardOutput.ReadLine() | ConvertFrom-Json
            if ($toolResponse.id -ne 2) { throw "installed MCP host returned an invalid tools/list response" }
            $toolNames = @($toolResponse.result.tools | ForEach-Object { $_.name })
            foreach ($name in @(
              "aliasmode_profiles_list",
              "aliasmode_profile_create",
              "aliasmode_profile_delete",
              "aliasmode_browser_open",
              "aliasmode_browser_select",
              "aliasmode_browser_status",
              "aliasmode_browser_close",
              "browser_close"
            )) {
              if ($toolNames -notcontains $name) { throw "installed MCP host did not expose $name" }
            }

            if (-not (Test-Path $descriptorPath -PathType Leaf)) { throw "background runtime descriptor is missing" }
            $descriptor = Get-Content $descriptorPath | ConvertFrom-Json
            if (
              $descriptor.protocol -ne "aliasmode-runtime-v1" -or
              $descriptor.appVersion -ne $bundleVersion -or
              $descriptor.readiness -ne "local" -or
              $descriptor.generation -notmatch '^[a-f0-9]{64}$' -or
              $descriptor.nonce -notmatch '^[a-f0-9]{64}$' -or
              $descriptor.generation -eq $descriptor.nonce -or
              $descriptor.port -le 0 -or
              $descriptor.desktopPid -le 0 -or
              $descriptor.sidecarPid -le 0
            ) {
              throw "background runtime descriptor is invalid"
            }
            $backgroundProcess = Get-CimInstance Win32_Process -Filter "ProcessId = $($descriptor.desktopPid)"
            if (-not $backgroundProcess -or $backgroundProcess.CommandLine -notmatch '(?:^|\s)--background(?:\s|$)') {
              throw "MCP host did not launch AliasMode in background mode"
            }
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class AliasModeWindow { [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string className, string windowName); [DllImport("user32.dll")] [return: MarshalAs(UnmanagedType.Bool)] public static extern bool IsWindowVisible(IntPtr handle); [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId); }'
            $backgroundHidden = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              $mainWindow = [AliasModeWindow]::FindWindow($null, "AliasMode")
              [uint32]$windowPid = 0
              [void][AliasModeWindow]::GetWindowThreadProcessId($mainWindow, [ref]$windowPid)
              if (
                $mainWindow -ne [IntPtr]::Zero -and
                $windowPid -eq $descriptor.desktopPid -and
                -not [AliasModeWindow]::IsWindowVisible($mainWindow)
              ) {
                $backgroundHidden = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $backgroundHidden) {
              if (Test-Path $lifecycleTrace -PathType Leaf) {
                Get-Content $lifecycleTrace | ForEach-Object { Write-Host "lifecycle trace: $_" }
              }
              Write-Host "window trace: handle=$([int64]$mainWindow) pid=$windowPid visible=$([AliasModeWindow]::IsWindowVisible($mainWindow))"
              throw "background AliasMode exposed its main window"
            }
          } finally {
            $mcp.StandardInput.Close()
            if (-not $mcp.WaitForExit(15000)) {
              Stop-Process -Id $mcp.Id -Force
              $mcp.WaitForExit()
              $mcpShutdownFailure = "installed MCP host survived stdio disconnect"
            }
          }
          if ($mcpShutdownFailure) { throw $mcpShutdownFailure }
          if (-not (Get-Process -Id $descriptor.desktopPid -ErrorAction SilentlyContinue)) {
            throw "background desktop did not survive MCP disconnect"
          }
          if (-not (Test-Path $descriptorPath -PathType Leaf)) {
            throw "runtime descriptor did not survive MCP disconnect"
          }

          $profile = (& $helper profiles create --name ci-agent --temporary | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or -not $profile.ok -or -not $profile.result.id) {
            throw "installed JSON CLI could not create a temporary profile: $($profile.error)"
          }
          $profileId = $profile.result.id
          $opened = & $helper browser open --profile $profileId --headless | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $opened.ok -or -not $opened.result.headless -or $opened.result.alreadyOpen) {
            $sidecarLog = Get-ChildItem (Join-Path $appData "logs\aliasmode-*.log") -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if ($sidecarLog) {
              Get-Content $sidecarLog.FullName |
                Select-String -Pattern 'sidecar start|launching .* on port|launch stage' |
                Select-Object -Last 12 |
                ForEach-Object {
                  $safeTrace = $_.Line -replace 'pid=\d+', 'pid=<pid>'
                  $safeTrace = $safeTrace -replace 'launching [A-Za-z0-9_-]+ on port \d+.*', 'launching <profile> on port <port>'
                  $safeTrace = $safeTrace -replace '[A-Za-z0-9_-]+: launch stage', '<profile>: launch stage'
                  Write-Host "launch trace: $safeTrace"
                }
            }
            throw "installed JSON CLI could not open a headless browser: $($opened.error)"
          }
          $status = & $helper browser status --profile $profileId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $status.ok -or -not $status.result.running) {
            throw "installed JSON CLI did not report its browser as running: $($status.error)"
          }
          $closed = & $helper browser close --profile $profileId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $closed.ok -or -not $closed.result.closed -or -not $closed.result.deleted) {
            throw "installed JSON CLI did not close and delete its temporary profile: $($closed.error)"
          }

          $app = Get-Process -Id $descriptor.desktopPid -ErrorAction Stop
          $reveal = Start-Process -PassThru $appPath
          if (-not $reveal.WaitForExit(15000)) {
            Stop-Process -Id $reveal.Id -Force
            throw "second normal AliasMode launch did not return to the background instance"
          }
          if ($reveal.ExitCode -ne 0) {
            throw "second normal AliasMode launch exited with code $($reveal.ExitCode)"
          }
          $sidecarPid = $null
          $shutdownFailure = $null
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw "installed AliasMode exited before desktop readiness" }
              $sidecar = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($app.Id)" |
                Where-Object { $_.Name -like "aliasmode-sidecar*.exe" } |
                Select-Object -First 1
              if ($sidecar) { $sidecarPid = [int]$sidecar.ProcessId }
              $mainWindow = [AliasModeWindow]::FindWindow($null, "AliasMode")
              [uint32]$windowPid = 0
              [void][AliasModeWindow]::GetWindowThreadProcessId($mainWindow, [ref]$windowPid)
              if (
                $sidecarPid -and
                $windowPid -eq $descriptor.desktopPid -and
                [AliasModeWindow]::IsWindowVisible($mainWindow)
              ) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $sidecarPid) { throw "installed desktop did not start its packaged sidecar" }
            if (
              $windowPid -ne $descriptor.desktopPid -or
              -not [AliasModeWindow]::IsWindowVisible($mainWindow)
            ) {
              throw "installed desktop did not show its main window"
            }
            Start-Sleep -Seconds 2
            $app.Refresh()
            $mainWindow = [AliasModeWindow]::FindWindow($null, "AliasMode")
            [uint32]$windowPid = 0
            [void][AliasModeWindow]::GetWindowThreadProcessId($mainWindow, [ref]$windowPid)
            if (
              $app.HasExited -or
              -not (Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue) -or
              $windowPid -ne $descriptor.desktopPid -or
              -not [AliasModeWindow]::IsWindowVisible($mainWindow)
            ) {
              throw "installed desktop did not remain ready"
            }
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              if (-not $app.CloseMainWindow()) {
                $shutdownFailure = "installed desktop rejected its main-window close request"
              } elseif (-not $app.WaitForExit(15000)) {
                $shutdownFailure = "installed desktop did not exit after its main window closed"
              }
              $app.Refresh()
              if (-not $app.HasExited) {
                Stop-Process -Id $app.Id -Force
                $app.WaitForExit()
              }
            }
          }
          if ($sidecarPid) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (-not (Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Milliseconds 500
            }
            if (Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue) {
              Stop-Process -Id $sidecarPid -Force
              if (-not $shutdownFailure) { $shutdownFailure = "packaged sidecar survived desktop shutdown" }
            }
          }
          if ($shutdownFailure) { throw $shutdownFailure }
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (-not (Test-Path $descriptorPath)) { break }
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $descriptorPath) { throw "runtime descriptor survived desktop shutdown" }

          $degradedApp = Start-Process -PassThru $appPath
          $degradedSidecarPid = $null
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $degradedApp.Refresh()
              if ($degradedApp.HasExited) { throw "degraded desktop exited before readiness" }
              if (Test-Path $descriptorPath -PathType Leaf) {
                $degradedDescriptor = Get-Content $descriptorPath | ConvertFrom-Json
                if ($degradedDescriptor.desktopPid -eq $degradedApp.Id) {
                  $degradedSidecarPid = [int]$degradedDescriptor.sidecarPid
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $degradedSidecarPid) { throw "degraded desktop did not publish its runtime descriptor" }
            Stop-Process -Id $degradedSidecarPid -Force
            if (-not $degradedApp.WaitForExit(15000)) {
              throw "degraded desktop did not exit after unexpected sidecar termination"
            }
            if ($degradedApp.ExitCode -eq 0) {
              throw "degraded desktop reported success after unexpected sidecar termination"
            }
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (-not (Test-Path $descriptorPath)) { break }
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path $descriptorPath) {
              throw "runtime descriptor survived unexpected sidecar termination"
            }
          } finally {
            $degradedApp.Refresh()
            if (-not $degradedApp.HasExited) {
              Stop-Process -Id $degradedApp.Id -Force
              $degradedApp.WaitForExit()
            }
          }

          $metadata = Get-Content ".\src-tauri\generated\browser.json" | ConvertFrom-Json
          if ($metadata.executable -ne "chrome.exe") { throw "Windows browser metadata does not target chrome.exe" }
          $browserPath = Join-Path $installRoot "cloakbrowser\chrome.exe"
          if (-not (Test-Path $browserPath -PathType Leaf)) { throw "installed CloakBrowser executable is missing" }
          if (-not (Test-Path (Join-Path $playwrightRuntime "node\node.exe") -PathType Leaf)) {
            throw "installed official Node runtime is missing"
          }
          if (-not (Test-Path (Join-Path $playwrightRuntime "worker.mjs") -PathType Leaf)) {
            throw "installed Playwright worker is missing"
          }
          if (-not (Test-Path (Join-Path $playwrightRuntime "node_modules\playwright-core\package.json") -PathType Leaf)) {
            throw "installed Playwright runtime is missing"
          }
          if (-not (Test-Path (Join-Path $playwrightRuntime "node_modules\ws\package.json") -PathType Leaf)) {
            throw "installed Playwright WebSocket runtime is missing"
          }

          $workerStart = [System.Diagnostics.ProcessStartInfo]::new()
          $workerStart.FileName = Join-Path $playwrightRuntime "node\node.exe"
          $workerStart.ArgumentList.Add("--input-type=module")
          $workerStart.ArgumentList.Add("--eval")
          $workerStart.ArgumentList.Add(@'
          import { pathToFileURL } from "node:url";
          try {
            await import(pathToFileURL(process.argv[1]).href);
          } catch {
            process.stdout.write(JSON.stringify({
              version: 1,
              ok: false,
              error: { code: "runtime_unavailable", message: "Playwright runtime is unavailable" },
            }));
            process.exitCode = 1;
          }
          '@)
          $workerStart.ArgumentList.Add((Join-Path $playwrightRuntime "worker.mjs"))
          $workerStart.UseShellExecute = $false
          $workerStart.RedirectStandardInput = $true
          $workerStart.RedirectStandardOutput = $true
          $workerStart.RedirectStandardError = $true
          foreach ($name in @($workerStart.Environment.Keys)) {
            if ($name -match '^(ALIASMODE_|CLOAKBROWSER_)' -or $name -match '^(NODE_OPTIONS|NODE_PATH|HUB_PASSWORD)$') {
              $workerStart.Environment.Remove($name)
            }
          }
          $worker = [System.Diagnostics.Process]::new()
          $worker.StartInfo = $workerStart
          if (-not $worker.Start()) { throw "installed Playwright worker did not start" }
          $worker.StandardInput.Write('{"version":1,"operation":"page","payload":{"endpoint":"not-a-url"}}')
          $worker.StandardInput.Close()
          $workerOutput = $worker.StandardOutput.ReadToEnd()
          $workerError = $worker.StandardError.ReadToEnd()
          $worker.WaitForExit()
          if ($worker.ExitCode -ne 1) { throw "installed Playwright worker exited with code $($worker.ExitCode)" }
          try { $workerResponse = $workerOutput | ConvertFrom-Json } catch { throw "installed Playwright worker returned malformed JSON" }
          if ($workerResponse.version -ne 1 -or $workerResponse.ok -ne $false -or $workerResponse.error.code -ne "invalid_request") {
            throw "installed Playwright worker returned an unexpected protocol response"
          }
          if (-not [string]::IsNullOrEmpty($workerError)) { throw "installed Playwright worker wrote to stderr" }

          $env:ALIASMODE_PLAYWRIGHT_RUNTIME = $playwrightRuntime
          $env:CLOAKBROWSER_BINARY_PATH = $browserPath
          $env:CLOAKBROWSER_BINARY_SHA256 = $metadata.sha256
          $env:ALIASMODE_SESSION_LAUNCH = "0"
          & $sidecars[0].FullName __cloud-launcher-smoke --proxy-mismatch --state-root (Join-Path $env:RUNNER_TEMP "aliasmode-installed-proxy-mismatch")
          if ($LASTEXITCODE -ne 0) {
            throw "installed deterministic proxy mismatch smoke exited with code $LASTEXITCODE"
          }

          if ([string]::IsNullOrWhiteSpace($env:ALIASMODE_LIVE_PROXY_HOST)) {
            Write-Host "Installed headful Cloud proxy smoke skipped: no temporary test proxy configured"
            exit 0
          }
          foreach ($proxyType in @("http", "socks5")) {
            $stateRoot = Join-Path $env:RUNNER_TEMP "aliasmode-installed-cloud-$proxyType"
            & $sidecars[0].FullName __cloud-launcher-smoke --proxy-type $proxyType --state-root $stateRoot
            if ($LASTEXITCODE -ne 0) {
              throw "installed headful Cloud proxy smoke exited with code $LASTEXITCODE"
            }
          }
      - name: Stage unsigned installer and checksum
        shell: pwsh
        run: |
          $bundleVersion = (Get-Content ".\src-tauri\tauri.conf.json" | ConvertFrom-Json).version
          $installerName = Split-Path $env:ALIASMODE_NSIS_INSTALLER -Leaf
          $versionMarker = "_$($bundleVersion)_"
          if (-not $installerName.Contains($versionMarker)) {
            throw "NSIS installer name does not contain bundle version ${bundleVersion}: $installerName"
          }
          $artifact = ".\artifacts\windows"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          $installer = Join-Path $artifact $installerName
          Copy-Item $env:ALIASMODE_NSIS_INSTALLER $installer
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $installerName" | Set-Content (Join-Path $artifact "SHA256SUMS.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: aliasmode-windows-unsigned
          path: |
            artifacts/windows/*.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
