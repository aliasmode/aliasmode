name: Windows update candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Client CI run containing aliasmode-windows-candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-update-candidate-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Validate release provenance
    runs-on: windows-latest
    outputs:
      product_key: ${{ steps.verify.outputs.product_key }}
      source: ${{ steps.verify.outputs.source }}
      successor_version: ${{ steps.successor.outputs.version }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Validate candidate source run
        id: source_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -cne "refs/heads/main") {
            throw "update candidates must run from main"
          }
          if ($env:INSTALLER_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw "installer run ID must be a positive integer"
          }
          & git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "could not resolve current origin/main" }
          $remoteMain = (& git rev-parse origin/main).Trim()
          $checkedOut = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $remoteMain -cne $env:GITHUB_SHA -or $checkedOut -cne $env:GITHUB_SHA) {
            throw "release workflow source is not current origin/main"
          }
          if (@(& git status --porcelain --untracked-files=all).Count -ne 0) {
            throw "release workflow source tree is not exact and clean"
          }

          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:INSTALLER_RUN_ID" | ConvertFrom-Json
          if (
            $run.name -cne "Client CI" -or
            $run.path -cne ".github/workflows/ci.yml" -or
            $run.status -cne "completed" -or
            $run.conclusion -cne "success" -or
            $run.event -cne "push" -or
            $run.head_branch -cne "main"
          ) {
            throw "installer run must be a successful Client CI push from main"
          }
          if (
            $run.repository.full_name -cne $env:GITHUB_REPOSITORY -or
            $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or
            $run.head_sha -cne $env:GITHUB_SHA
          ) {
            throw "installer run repository or source identity did not match current main"
          }
          $sourceCommit = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$($run.head_sha)" | ConvertFrom-Json
          $currentCommit = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$env:GITHUB_SHA" | ConvertFrom-Json
          if ($sourceCommit.tree.sha -cne $currentCommit.tree.sha) {
            throw "installer run source tree does not match current main"
          }
          "source=$($run.head_sha)" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-windows-candidate
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-windows-unsigned-synthetic-successor
          path: unsigned-successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
      - name: Verify candidate artifact and version
        id: verify
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_SOURCE: ${{ steps.source_run.outputs.source }}
        run: |
          $ErrorActionPreference = "Stop"
          bun test version.test.ts
          if ($LASTEXITCODE -ne 0) { throw "version alignment test failed" }

          $version = [string](Get-Content ".\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          $semantic = [Management.Automation.SemanticVersion]::Parse($version)
          if ($semantic.ToString() -cne $version) { throw "candidate version is not canonical" }
          $fullName = "AliasMode_${version}_x64-offline-setup.exe"
          $slimName = "AliasMode_${version}_x64-setup.exe"
          $payloadNames = @($fullName, $slimName, "browser.json", "SHA256SUMS.txt", "size-report.json")
          $requiredNames = @($payloadNames + "artifact-manifest.json") | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath ".\candidate" -Force)
          $actualNames = @($entries | ForEach-Object Name | Sort-Object)
          if (
            $entries.Count -ne 6 -or
            @($entries | Where-Object {
              $_.PSIsContainer -or (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
            }).Count -ne 0 -or
            ($actualNames -join "`n") -cne ($requiredNames -join "`n")
          ) {
            throw "candidate artifact must contain exactly six regular files"
          }

          $manifest = Get-Content ".\candidate\artifact-manifest.json" -Raw | ConvertFrom-Json
          $productKey = [string]$manifest.productKey
          if (
            $manifest.schema -ne 1 -or
            $manifest.role -cne "candidate" -or
            $manifest.source -cne $env:WINDOWS_SOURCE -or
            $manifest.version -cne $version -or
            $productKey -notmatch '^[a-f0-9]{64}$'
          ) {
            throw "candidate artifact provenance is invalid"
          }
          $manifestArguments = @(
            ".\candidate",
            "--role", "candidate",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $version,
            "--product-key", $productKey
          )
          foreach ($name in $payloadNames) { $manifestArguments += @("--file", $name) }
          & bun scripts/windows-artifact-manifest.ts verify @manifestArguments
          if ($LASTEXITCODE -ne 0) { throw "candidate artifact manifest verification failed" }

          $checksums = @{}
          foreach ($line in @([IO.File]::ReadAllLines(".\candidate\SHA256SUMS.txt"))) {
            if ($line -notmatch '^([a-f0-9]{64})  ([^\\/]+)$' -or $checksums.ContainsKey($Matches[2])) {
              throw "candidate checksum manifest is malformed"
            }
            $checksums[$Matches[2]] = $Matches[1]
          }
          if ($checksums.Count -ne 2 -or -not $checksums.ContainsKey($fullName) -or -not $checksums.ContainsKey($slimName)) {
            throw "candidate checksum manifest must contain exactly both installers"
          }
          foreach ($name in @($fullName, $slimName)) {
            $installer = Join-Path ".\candidate" $name
            $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $checksums[$name]) { throw "candidate installer SHA-256 mismatch: $name" }
            $stream = [IO.File]::OpenRead($installer)
            try {
              if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
                throw "candidate installer must be a Windows PE file: $name"
              }
            } finally {
              $stream.Dispose()
            }
          }
          $fullSize = (Get-Item -LiteralPath (Join-Path ".\candidate" $fullName)).Length
          $slimSize = (Get-Item -LiteralPath (Join-Path ".\candidate" $slimName)).Length
          $sizes = Get-Content ".\candidate\size-report.json" -Raw | ConvertFrom-Json
          if (
            $sizes.full.name -cne $fullName -or $sizes.full.bytes -ne $fullSize -or
            $sizes.slim.name -cne $slimName -or $sizes.slim.bytes -ne $slimSize -or
            $sizes.deltaBytes -ne ($fullSize - $slimSize) -or $sizes.deltaBytes -lt 100MB
          ) {
            throw "candidate installer size report is inconsistent"
          }
          $browser = Get-Content ".\candidate\browser.json" -Raw | ConvertFrom-Json
          if ($browser.executable -cne "chrome.exe" -or [string]$browser.sha256 -notmatch '^[a-f0-9]{64}$') {
            throw "candidate browser metadata is invalid"
          }

          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $releases = @(Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" -Headers $headers | Write-Output)
          foreach ($release in $releases) {
            if ($release.draft -or -not $release.tag_name.StartsWith("v")) { continue }
            try {
              $published = [Management.Automation.SemanticVersion]::Parse($release.tag_name.Substring(1))
            } catch {
              continue
            }
            if ($semantic -le $published) {
              throw "candidate version $version must be newer than published release $($release.tag_name)"
            }
          }

          "product_key=$productKey" | Add-Content $env:GITHUB_OUTPUT
          "source=$env:WINDOWS_SOURCE" | Add-Content $env:GITHUB_OUTPUT
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
      - name: Verify unsigned synthetic successor artifact
        id: successor
        shell: pwsh
        env:
          WINDOWS_PRODUCT_KEY: ${{ steps.verify.outputs.product_key }}
          WINDOWS_SOURCE: ${{ steps.verify.outputs.source }}
          WINDOWS_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceSemantic = [Management.Automation.SemanticVersion]::Parse($env:WINDOWS_VERSION)
          $successorVersion = if ($env:WINDOWS_VERSION.Contains("-")) {
            "$($env:WINDOWS_VERSION).acceptance.1"
          } else {
            "$($sourceSemantic.Major).$($sourceSemantic.Minor).$($sourceSemantic.Patch + 1)-acceptance.1"
          }
          $successorSemantic = [Management.Automation.SemanticVersion]::Parse($successorVersion)
          if ($successorSemantic -le $sourceSemantic -or $successorSemantic.ToString() -cne $successorVersion) {
            throw "synthetic successor version is not canonical and newer"
          }

          $name = "AliasMode_${successorVersion}_x64-setup.exe"
          $requiredNames = @($name, "artifact-manifest.json") | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath ".\unsigned-successor" -Force)
          $actualNames = @($entries | ForEach-Object Name | Sort-Object)
          if (
            $entries.Count -ne 2 -or
            @($entries | Where-Object {
              $_.PSIsContainer -or (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
            }).Count -ne 0 -or
            ($actualNames -join "`n") -cne ($requiredNames -join "`n")
          ) {
            throw "unsigned synthetic successor artifact must contain exactly two regular files"
          }

          $installer = Join-Path ".\unsigned-successor" $name
          $manifest = Get-Content ".\unsigned-successor\artifact-manifest.json" -Raw | ConvertFrom-Json
          $fileIdentity = @($manifest.files)
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item -LiteralPath $installer).Length
          if (
            $manifest.schema -ne 1 -or
            $manifest.role -cne "unsigned-synthetic-successor" -or
            $manifest.source -cne $env:WINDOWS_SOURCE -or
            $manifest.version -cne $successorVersion -or
            $manifest.productKey -cne $env:WINDOWS_PRODUCT_KEY -or
            $fileIdentity.Count -ne 1 -or
            $fileIdentity[0].name -cne $name -or
            $fileIdentity[0].sha256 -cne $actualHash -or
            $fileIdentity[0].bytes -ne $actualSize
          ) {
            throw "unsigned synthetic successor provenance is invalid"
          }
          & bun scripts/windows-artifact-manifest.ts verify ".\unsigned-successor" `
            --role unsigned-synthetic-successor `
            --source $env:WINDOWS_SOURCE `
            --version $successorVersion `
            --product-key $env:WINDOWS_PRODUCT_KEY `
            --file $name
          if ($LASTEXITCODE -ne 0) { throw "unsigned synthetic successor manifest verification failed" }

          $stream = [IO.File]::OpenRead($installer)
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw "unsigned synthetic successor must be a Windows PE file"
            }
          } finally {
            $stream.Dispose()
          }
          if ([string](Get-AuthenticodeSignature -LiteralPath $installer).Status -cne "NotSigned") {
            throw "synthetic successor source artifact must be unsigned"
          }
          "version=$successorVersion" | Add-Content $env:GITHUB_OUTPUT
      - name: Upload verified release provenance
        uses: actions/upload-artifact@v4
        with:
          name: aliasmode-release-provenance
          path: candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign_current:
    name: Sign current release assets
    needs: provenance
    runs-on: windows-latest
    environment: windows-release
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/updater-signature-check -> target
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-release-provenance
          path: candidate
      - name: Verify current producer input
        shell: pwsh
        env:
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $fullName = "AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe"
          $slimName = "AliasMode_$($env:WINDOWS_VERSION)_x64-setup.exe"
          $arguments = @(
            ".\candidate",
            "--role", "candidate",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:WINDOWS_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY,
            "--file", $fullName,
            "--file", $slimName,
            "--file", "browser.json",
            "--file", "SHA256SUMS.txt",
            "--file", "size-report.json"
          )
          & bun scripts/windows-artifact-manifest.ts verify @arguments
          if ($LASTEXITCODE -ne 0) { throw "current producer input verification failed" }
      - name: Sign updater and build release assets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if (
            [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
            [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          ) {
            throw "protected Tauri updater signing secrets are unavailable"
          }

          $tag = "v$($env:WINDOWS_VERSION)"
          $fullName = "AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe"
          $slimName = "AliasMode_$($env:WINDOWS_VERSION)_x64-setup.exe"
          $signatureName = "$slimName.sig"
          $artifact = ".\artifacts\signed-current"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          $fullInstaller = Join-Path $artifact $fullName
          $slimInstaller = Join-Path $artifact $slimName
          Copy-Item (Join-Path ".\candidate" $fullName) $fullInstaller
          Copy-Item (Join-Path ".\candidate" $slimName) $slimInstaller
          $sourceFullHash = (Get-FileHash -LiteralPath (Join-Path ".\candidate" $fullName) -Algorithm SHA256).Hash
          if ((Get-FileHash -LiteralPath $fullInstaller -Algorithm SHA256).Hash -cne $sourceFullHash) {
            throw "copied full installer SHA-256 mismatch"
          }

          $updaterHeader = [IO.File]::ReadAllBytes($slimInstaller)[0..1]
          if ($updaterHeader[0] -ne 0x4d -or $updaterHeader[1] -ne 0x5a) {
            throw "updater artifact must be a raw Windows PE"
          }
          try {
            bunx tauri signer sign $slimInstaller
            $signExit = $LASTEXITCODE
          } finally {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          if ($signExit -ne 0) { throw "Tauri updater signing failed" }
          $signaturePath = "$slimInstaller.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "updater signature is missing"
          }

          $publicKey = [string](Get-Content ".\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).plugins.updater.pubkey
          cargo run --quiet --locked --manifest-path ".\scripts\updater-signature-check\Cargo.toml" -- $slimInstaller $signaturePath $publicKey
          if ($LASTEXITCODE -ne 0) { throw "updater signature verification failed" }
          $corrupt = Join-Path $env:RUNNER_TEMP "corrupt-current-update.exe"
          Copy-Item $slimInstaller $corrupt
          $bytes = [IO.File]::ReadAllBytes($corrupt)
          $middle = [Math]::Floor($bytes.Length / 2)
          $bytes[$middle] = $bytes[$middle] -bxor 1
          [IO.File]::WriteAllBytes($corrupt, $bytes)
          cargo run --quiet --locked --manifest-path ".\scripts\updater-signature-check\Cargo.toml" -- $corrupt $signaturePath $publicKey
          if ($LASTEXITCODE -eq 0) { throw "corrupted updater unexpectedly passed signature verification" }
          $global:LASTEXITCODE = 0

          $signature = [IO.File]::ReadAllText($signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "updater signature is blank" }
          $releaseBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag"
          $slimDownloadUrl = "$releaseBase/$slimName"
          $latestPath = Join-Path $artifact "latest-v2.json"
          [ordered]@{
            version = $env:WINDOWS_VERSION
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = $slimDownloadUrl
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content $latestPath -Encoding utf8
          $latest = Get-Content $latestPath -Raw | ConvertFrom-Json
          if (
            $latest.version -cne $env:WINDOWS_VERSION -or
            @($latest.platforms.PSObject.Properties).Count -ne 1 -or
            $latest.platforms."windows-x86_64".url -cne $slimDownloadUrl -or
            $latest.platforms."windows-x86_64".signature -cne $signature
          ) {
            throw "generated updater manifest is inconsistent"
          }

          $bootstrapPath = Join-Path $artifact "aliasmode-agent-bootstrap.json"
          bun scripts/write-agent-bootstrap-manifest.ts $fullInstaller $releaseBase $bootstrapPath
          if ($LASTEXITCODE -ne 0) { throw "agent bootstrap manifest generation failed" }
          $bootstrap = Get-Content $bootstrapPath -Raw | ConvertFrom-Json
          $fullHash = (Get-FileHash -LiteralPath $fullInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if (
            $bootstrap.version -cne $env:WINDOWS_VERSION -or
            $bootstrap.installer.name -cne $fullName -or
            $bootstrap.installer.url -cne "$releaseBase/$fullName" -or
            $bootstrap.installer.sha256 -cne $fullHash -or
            $bootstrap.installer.size -ne (Get-Item -LiteralPath $fullInstaller).Length
          ) {
            throw "generated agent bootstrap manifest is inconsistent"
          }

          $hashInputs = @($fullInstaller, $slimInstaller, $signaturePath, $latestPath, $bootstrapPath)
          $hashLines = @(
            $hashInputs |
              Sort-Object { Split-Path $_ -Leaf } |
              ForEach-Object {
                "$((Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)"
              }
          )
          [IO.File]::WriteAllText(
            (Join-Path $artifact "SHA256SUMS.txt"),
            (($hashLines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          $releaseNames = @(
            $fullName,
            $slimName,
            $signatureName,
            "latest-v2.json",
            "aliasmode-agent-bootstrap.json",
            "SHA256SUMS.txt"
          )
          $entries = @(Get-ChildItem -LiteralPath $artifact -Force)
          $actualNames = @($entries | ForEach-Object Name | Sort-Object)
          $expectedNames = @($releaseNames | Sort-Object)
          if (
            $entries.Count -ne 6 -or
            @($entries | Where-Object {
              $_.PSIsContainer -or (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
            }).Count -ne 0 -or
            ($actualNames -join "`n") -cne ($expectedNames -join "`n")
          ) {
            throw "release producer must contain exactly six regular assets"
          }

          $releaseHashes = @{}
          foreach ($line in @([IO.File]::ReadAllLines((Join-Path $artifact "SHA256SUMS.txt")))) {
            if ($line -notmatch '^([a-f0-9]{64})  ([^\\/]+)$' -or $releaseHashes.ContainsKey($Matches[2])) {
              throw "release checksum manifest is malformed"
            }
            $releaseHashes[$Matches[2]] = $Matches[1]
          }
          $hashedNames = @($releaseNames | Where-Object { $_ -cne "SHA256SUMS.txt" } | Sort-Object)
          if ((@($releaseHashes.Keys | Sort-Object) -join "`n") -cne ($hashedNames -join "`n")) {
            throw "release checksum manifest must hash exactly five assets"
          }
          foreach ($name in $hashedNames) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $artifact $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $releaseHashes[$name]) { throw "release asset SHA-256 mismatch: $name" }
          }

          $producerArguments = @(
            $artifact,
            "--role", "signed-current",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:WINDOWS_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY
          )
          foreach ($name in $releaseNames) { $producerArguments += @("--file", $name) }
          & bun scripts/windows-artifact-manifest.ts create @producerArguments
          if ($LASTEXITCODE -ne 0) { throw "signed-current producer manifest creation failed" }
          & bun scripts/windows-artifact-manifest.ts verify @producerArguments
          if ($LASTEXITCODE -ne 0) { throw "signed-current producer manifest verification failed" }
      - name: Upload signed current producer
        uses: actions/upload-artifact@v4
        with:
          name: aliasmode-signed-current
          path: artifacts/signed-current
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign_successor:
    name: Sign synthetic successor
    needs: provenance
    runs-on: windows-latest
    environment: windows-release
    timeout-minutes: 35
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/updater-signature-check -> target
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-windows-unsigned-synthetic-successor
          path: unsigned-successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
      - name: Verify unsigned synthetic successor source
        shell: pwsh
        env:
          SUCCESSOR_VERSION: ${{ needs.provenance.outputs.successor_version }}
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "AliasMode_$($env:SUCCESSOR_VERSION)_x64-setup.exe"
          $requiredNames = @($name, "artifact-manifest.json") | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath ".\unsigned-successor" -Force)
          $actualNames = @($entries | ForEach-Object Name | Sort-Object)
          if (
            $entries.Count -ne 2 -or
            @($entries | Where-Object {
              $_.PSIsContainer -or (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)
            }).Count -ne 0 -or
            ($actualNames -join "`n") -cne ($requiredNames -join "`n")
          ) {
            throw "unsigned synthetic successor source must contain exactly two regular files"
          }

          $installer = Join-Path ".\unsigned-successor" $name
          $manifest = Get-Content ".\unsigned-successor\artifact-manifest.json" -Raw | ConvertFrom-Json
          $fileIdentity = @($manifest.files)
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item -LiteralPath $installer).Length
          if (
            $manifest.schema -ne 1 -or
            $manifest.role -cne "unsigned-synthetic-successor" -or
            $manifest.source -cne $env:WINDOWS_SOURCE -or
            $manifest.version -cne $env:SUCCESSOR_VERSION -or
            $manifest.productKey -cne $env:WINDOWS_PRODUCT_KEY -or
            $fileIdentity.Count -ne 1 -or
            $fileIdentity[0].name -cne $name -or
            $fileIdentity[0].sha256 -cne $actualHash -or
            $fileIdentity[0].bytes -ne $actualSize
          ) {
            throw "unsigned synthetic successor source provenance is invalid"
          }
          & bun scripts/windows-artifact-manifest.ts verify ".\unsigned-successor" `
            --role unsigned-synthetic-successor `
            --source $env:WINDOWS_SOURCE `
            --version $env:SUCCESSOR_VERSION `
            --product-key $env:WINDOWS_PRODUCT_KEY `
            --file $name
          if ($LASTEXITCODE -ne 0) { throw "unsigned synthetic successor source verification failed" }

          $stream = [IO.File]::OpenRead($installer)
          try {
            if ($stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
              throw "unsigned synthetic successor source must be a Windows PE file"
            }
          } finally {
            $stream.Dispose()
          }
          if ([string](Get-AuthenticodeSignature -LiteralPath $installer).Status -cne "NotSigned") {
            throw "synthetic successor source must be unsigned"
          }

          $artifact = ".\artifacts\synthetic-successor"
          New-Item -ItemType Directory -Force $artifact | Out-Null
          $signedInstaller = Join-Path $artifact $name
          Copy-Item $installer $signedInstaller
          if ((Get-FileHash -LiteralPath $signedInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $actualHash) {
            throw "copied synthetic successor SHA-256 mismatch"
          }
          if ([string](Get-AuthenticodeSignature -LiteralPath $signedInstaller).Status -cne "NotSigned") {
            throw "copied synthetic successor must be unsigned"
          }
      - name: Sign and verify synthetic successor
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUCCESSOR_VERSION: ${{ needs.provenance.outputs.successor_version }}
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
        run: |
          $ErrorActionPreference = "Stop"
          if (
            [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
            [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          ) {
            throw "protected Tauri updater signing secrets are unavailable"
          }
          $artifact = ".\artifacts\synthetic-successor"
          $name = "AliasMode_$($env:SUCCESSOR_VERSION)_x64-setup.exe"
          $installer = Join-Path $artifact $name
          try {
            bunx tauri signer sign $installer
            $signExit = $LASTEXITCODE
          } finally {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          if ($signExit -ne 0) { throw "synthetic successor signing failed" }
          $signaturePath = "$installer.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "synthetic successor signature is missing"
          }

          $publicKey = [string](Get-Content ".\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).plugins.updater.pubkey
          cargo run --quiet --locked --manifest-path ".\scripts\updater-signature-check\Cargo.toml" -- $installer $signaturePath $publicKey
          if ($LASTEXITCODE -ne 0) { throw "synthetic successor signature verification failed" }
          $corrupt = Join-Path $env:RUNNER_TEMP "corrupt-successor-update.exe"
          Copy-Item $installer $corrupt
          $bytes = [IO.File]::ReadAllBytes($corrupt)
          $middle = [Math]::Floor($bytes.Length / 2)
          $bytes[$middle] = $bytes[$middle] -bxor 1
          [IO.File]::WriteAllBytes($corrupt, $bytes)
          cargo run --quiet --locked --manifest-path ".\scripts\updater-signature-check\Cargo.toml" -- $corrupt $signaturePath $publicKey
          if ($LASTEXITCODE -eq 0) { throw "corrupted synthetic successor unexpectedly passed signature verification" }
          $global:LASTEXITCODE = 0

          $signature = [IO.File]::ReadAllText($signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw "synthetic successor signature is blank" }
          $tag = "v$($env:SUCCESSOR_VERSION)"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          $manifestPath = Join-Path $artifact "latest-v2.json"
          [ordered]@{
            version = $env:SUCCESSOR_VERSION
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = $url
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8
          $latest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (
            $latest.version -cne $env:SUCCESSOR_VERSION -or
            @($latest.platforms.PSObject.Properties).Count -ne 1 -or
            $latest.platforms."windows-x86_64".url -cne $url -or
            $latest.platforms."windows-x86_64".signature -cne $signature
          ) {
            throw "synthetic successor manifest is inconsistent"
          }

          $producerArguments = @(
            $artifact,
            "--role", "synthetic-successor",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:SUCCESSOR_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY,
            "--file", $name,
            "--file", "$name.sig",
            "--file", "latest-v2.json"
          )
          & bun scripts/windows-artifact-manifest.ts create @producerArguments
          if ($LASTEXITCODE -ne 0) { throw "synthetic successor producer manifest creation failed" }
          & bun scripts/windows-artifact-manifest.ts verify @producerArguments
          if ($LASTEXITCODE -ne 0) { throw "synthetic successor producer manifest verification failed" }
      - name: Upload synthetic successor producer
        uses: actions/upload-artifact@v4
        with:
          name: aliasmode-synthetic-successor
          path: artifacts/synthetic-successor
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  previous_upgrade_acceptance:
    name: Previous-version upgrade acceptance
    needs: provenance
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-release-provenance
          path: candidate
      - name: Verify candidate producer
        shell: pwsh
        env:
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $fullName = "AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe"
          $slimName = "AliasMode_$($env:WINDOWS_VERSION)_x64-setup.exe"
          $arguments = @(
            ".\candidate",
            "--role", "candidate",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:WINDOWS_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY,
            "--file", $fullName,
            "--file", $slimName,
            "--file", "browser.json",
            "--file", "SHA256SUMS.txt",
            "--file", "size-report.json"
          )
          & bun scripts/windows-artifact-manifest.ts verify @arguments
          if ($LASTEXITCODE -ne 0) { throw "candidate producer verification failed" }
      - name: Test previous-version upgrade and data preservation
        timeout-minutes: 35
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $diagnostics = ".\diagnostics\previous-upgrade.json"
          & .\scripts\windows-previous-upgrade-acceptance.ps1 `
            -CandidateVersion $env:WINDOWS_VERSION `
            -FullInstallerPath ".\candidate\AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe" `
            -ChecksumsPath ".\candidate\SHA256SUMS.txt" `
            -Repository $env:GITHUB_REPOSITORY `
            -GitHubToken $env:GITHUB_TOKEN `
            -DiagnosticsPath $diagnostics
      - name: Upload previous-upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasmode-windows-previous-upgrade-diagnostics-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  exact_updater_acceptance:
    name: Exact in-app updater acceptance
    needs: [provenance, sign_successor]
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-release-provenance
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-synthetic-successor
          path: synthetic-successor
      - name: Verify acceptance producer artifacts
        shell: pwsh
        env:
          SUCCESSOR_VERSION: ${{ needs.provenance.outputs.successor_version }}
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $fullName = "AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe"
          $slimName = "AliasMode_$($env:WINDOWS_VERSION)_x64-setup.exe"
          $currentArguments = @(
            ".\candidate",
            "--role", "candidate",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:WINDOWS_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY,
            "--file", $fullName,
            "--file", $slimName,
            "--file", "browser.json",
            "--file", "SHA256SUMS.txt",
            "--file", "size-report.json"
          )
          & bun scripts/windows-artifact-manifest.ts verify @currentArguments
          if ($LASTEXITCODE -ne 0) { throw "candidate producer verification failed" }

          $successorName = "AliasMode_$($env:SUCCESSOR_VERSION)_x64-setup.exe"
          $successorArguments = @(
            ".\synthetic-successor",
            "--role", "synthetic-successor",
            "--source", $env:WINDOWS_SOURCE,
            "--version", $env:SUCCESSOR_VERSION,
            "--product-key", $env:WINDOWS_PRODUCT_KEY,
            "--file", $successorName,
            "--file", "$successorName.sig",
            "--file", "latest-v2.json"
          )
          & bun scripts/windows-artifact-manifest.ts verify @successorArguments
          if ($LASTEXITCODE -ne 0) { throw "synthetic successor producer verification failed" }
      - name: Test candidate through the exact updater protocol
        timeout-minutes: 35
        shell: pwsh
        env:
          SUCCESSOR_VERSION: ${{ needs.provenance.outputs.successor_version }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $successorName = "AliasMode_$($env:SUCCESSOR_VERSION)_x64-setup.exe"
          & .\scripts\windows-in-app-update-acceptance.ps1 `
            -SourceVersion $env:WINDOWS_VERSION `
            -SourceInstallerPath ".\candidate\AliasMode_$($env:WINDOWS_VERSION)_x64-offline-setup.exe" `
            -SourceChecksumsPath ".\candidate\SHA256SUMS.txt" `
            -CandidateVersion $env:SUCCESSOR_VERSION `
            -CandidateInstallerPath ".\synthetic-successor\$successorName" `
            -CandidateSignaturePath ".\synthetic-successor\$successorName.sig" `
            -CandidateManifestPath ".\synthetic-successor\latest-v2.json" `
            -DiagnosticsPath ".\diagnostics\in-app-update.json"
      - name: Upload exact-updater diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aliasmode-windows-in-app-update-diagnostics-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  publish_release:
    name: Publish verified prerelease
    needs: [provenance, sign_current, previous_upgrade_acceptance, exact_updater_acceptance]
    runs-on: ubuntu-latest
    environment: windows-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.provenance.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-signed-current
          path: signed-current
      - name: Verify publish producer artifact
        shell: bash
        env:
          WINDOWS_PRODUCT_KEY: ${{ needs.provenance.outputs.product_key }}
          WINDOWS_SOURCE: ${{ needs.provenance.outputs.source }}
          WINDOWS_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          full_name="AliasMode_${WINDOWS_VERSION}_x64-offline-setup.exe"
          slim_name="AliasMode_${WINDOWS_VERSION}_x64-setup.exe"
          bun scripts/windows-artifact-manifest.ts verify ./signed-current \
            --role signed-current \
            --source "$WINDOWS_SOURCE" \
            --version "$WINDOWS_VERSION" \
            --product-key "$WINDOWS_PRODUCT_KEY" \
            --file "$full_name" \
            --file "$slim_name" \
            --file "$slim_name.sig" \
            --file latest-v2.json \
            --file aliasmode-agent-bootstrap.json \
            --file SHA256SUMS.txt
      - name: Create, verify, and publish exact release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.provenance.outputs.source }}
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/signed-current"
          tag="v${RELEASE_VERSION}"
          release_name="AliasMode ${RELEASE_VERSION}"
          marker="<!-- aliasmode-release-run:${GITHUB_RUN_ID};source:${RELEASE_SOURCE} -->"
          full_name="AliasMode_${RELEASE_VERSION}_x64-offline-setup.exe"
          slim_name="AliasMode_${RELEASE_VERSION}_x64-setup.exe"
          required=(
            "$full_name"
            "$slim_name"
            "$slim_name.sig"
            "latest-v2.json"
            "aliasmode-agent-bootstrap.json"
            "SHA256SUMS.txt"
          )
          mapfile -t expected_names < <(printf '%s\n' "${required[@]}" | sort)
          mapfile -t actual_names < <(find "$root" -mindepth 1 -maxdepth 1 -type f ! -name artifact-manifest.json -printf '%f\n' | sort)
          if [[ "${#actual_names[@]}" -ne 6 || "$(printf '%s\n' "${actual_names[@]}")" != "$(printf '%s\n' "${expected_names[@]}")" ]]; then
            printf 'publish producer does not contain the exact six release assets\n' >&2
            exit 1
          fi
          if find "$root" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            printf 'publish producer contains a non-file entry\n' >&2
            exit 1
          fi
          if [[ "$(wc -l < "$root/SHA256SUMS.txt")" -ne 5 ]]; then
            printf 'release checksum manifest must contain exactly five lines\n' >&2
            exit 1
          fi
          (
            cd "$root"
            sha256sum --check --strict SHA256SUMS.txt
          )
          mapfile -t checksum_names < <(cut -d' ' -f3- "$root/SHA256SUMS.txt" | sort)
          mapfile -t expected_hashed < <(printf '%s\n' "${required[@]}" | grep -v '^SHA256SUMS\.txt$' | sort)
          if [[ "$(printf '%s\n' "${checksum_names[@]}")" != "$(printf '%s\n' "${expected_hashed[@]}")" ]]; then
            printf 'release checksum manifest names are not exact\n' >&2
            exit 1
          fi

          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          matches="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)]' <<<"$releases")"
          match_count="$(jq 'length' <<<"$matches")"
          already_published=false
          if [[ "$match_count" -gt 1 ]]; then
            printf 'release tag is ambiguous\n' >&2
            exit 1
          fi
          if [[ "$match_count" -eq 1 ]]; then
            release="$(jq '.[0]' <<<"$matches")"
            if [[ "$(jq -r '.prerelease' <<<"$release")" != true ||
                  "$(jq -r '.target_commitish' <<<"$release")" != "$RELEASE_SOURCE" ||
                  "$(jq -r '.name' <<<"$release")" != "$release_name" ||
                  "$(jq -r '.body' <<<"$release")" != "$marker" ]]; then
              printf 'existing release conflicts with this source run\n' >&2
              exit 1
            fi
            if [[ "$(jq -r '.draft' <<<"$release")" == false ]]; then
              already_published=true
            fi
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              printf 'tag already exists without the expected draft release\n' >&2
              exit 1
            fi
            release="$(
              jq -n \
                --arg tag "$tag" \
                --arg source "$RELEASE_SOURCE" \
                --arg name "$release_name" \
                --arg body "$marker" \
                '{tag_name:$tag,target_commitish:$source,name:$name,body:$body,draft:true,prerelease:true}' |
                gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input -
            )"
          fi
          release_id="$(jq -r '.id' <<<"$release")"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            printf 'draft release ID is invalid\n' >&2
            exit 1
          fi

          declare -A local_hashes
          for name in "${required[@]}"; do
            local_hashes["$name"]="$(sha256sum "$root/$name" | cut -d' ' -f1)"
          done
          for name in "${required[@]}"; do
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
            matching="$(jq --arg name "$name" '[.[] | select(.name == $name)]' <<<"$assets")"
            count="$(jq 'length' <<<"$matching")"
            if [[ "$count" -gt 1 ]]; then
              printf 'release asset is ambiguous: %s\n' "$name" >&2
              exit 1
            fi
            if [[ "$already_published" == true && "$count" -ne 1 ]]; then
              printf 'published release is missing an exact asset: %s\n' "$name" >&2
              exit 1
            fi
            if [[ "$count" -eq 1 ]]; then
              asset_id="$(jq -r '.[0].id' <<<"$matching")"
              asset_state="$(jq -r '.[0].state' <<<"$matching")"
              if [[ "$asset_state" == starter ]]; then
                if [[ "$already_published" == true ]]; then
                  printf 'published release contains an incomplete asset: %s\n' "$name" >&2
                  exit 1
                fi
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              elif [[ "$asset_state" == uploaded ]]; then
                remote="$RUNNER_TEMP/existing-$asset_id"
                gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$remote"
                if [[ "$(sha256sum "$remote" | cut -d' ' -f1)" != "${local_hashes[$name]}" ]]; then
                  printf 'existing draft asset conflicts with local producer: %s\n' "$name" >&2
                  exit 1
                fi
                continue
              else
                printf 'existing draft asset has an invalid state: %s/%s\n' "$name" "$asset_state" >&2
                exit 1
              fi
            fi
            encoded="$(jq -rn --arg value "$name" '$value|@uri')"
            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$root/$name" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded" \
              >/dev/null
          done

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          mapfile -t remote_names < <(jq -r '.[].name' <<<"$assets" | sort)
          if [[ "${#remote_names[@]}" -ne 6 || "$(printf '%s\n' "${remote_names[@]}")" != "$(printf '%s\n' "${expected_names[@]}")" ]]; then
            printf 'draft release does not contain the exact six assets\n' >&2
            exit 1
          fi
          if [[ "$(jq '[.[] | select(.state != "uploaded")] | length' <<<"$assets")" -ne 0 ]]; then
            printf 'draft release contains an asset that is not fully uploaded\n' >&2
            exit 1
          fi
          for name in "${required[@]}"; do
            asset_id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"$assets")"
            remote="$RUNNER_TEMP/verified-$asset_id"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$remote"
            if [[ "$(sha256sum "$remote" | cut -d' ' -f1)" != "${local_hashes[$name]}" ]]; then
              printf 'uploaded release asset SHA-256 mismatch: %s\n' "$name" >&2
              exit 1
            fi
          done

          if [[ "$already_published" == true ]]; then
            published="$release"
          else
            published="$(jq -n '{draft:false,prerelease:true}' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input -)"
          fi
          if [[ "$(jq -r '.draft' <<<"$published")" != false ||
                "$(jq -r '.prerelease' <<<"$published")" != true ||
                "$(jq -r '.tag_name' <<<"$published")" != "$tag" ||
                "$(jq -r '.target_commitish' <<<"$published")" != "$RELEASE_SOURCE" ]]; then
            printf 'published prerelease identity is inconsistent\n' >&2
            exit 1
          fi
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          object_type="$(jq -r '.object.type' <<<"$ref")"
          object_sha="$(jq -r '.object.sha' <<<"$ref")"
          if [[ "$object_type" == tag ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_object")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          fi
          if [[ "$object_type" != commit || "$object_sha" != "$RELEASE_SOURCE" ]]; then
            printf 'published release tag does not point to the validated source\n' >&2
            exit 1
          fi
