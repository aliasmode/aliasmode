name: Firefox compatibility

on:
  push:
    paths:
      - .github/workflows/firefox-compatibility.yml
      - scripts/firefox-compatibility-smoke.mjs
      - scripts/firefox-launcher-acceptance.ts
      - scripts/firefox-owner-smoke.mjs
      - scripts/firefox-owner-bridge-smoke-runner.mjs
      - scripts/firefox-owner-smoke-manager.mjs
      - launcher.ts
      - firefox-config.ts
      - firefox-runtime.ts
      - firefox-lifecycle.ts
      - portable-profile.ts
      - session.ts
      - store.ts
      - types.ts
      - firefox-worker.mjs
      - playwright-runtime.ts
      - playwright-worker.mjs
      - agent/playwright-proxy.mjs
      - package.json
      - bun.lock
  pull_request:
    paths:
      - .github/workflows/firefox-compatibility.yml
      - scripts/firefox-compatibility-smoke.mjs
      - scripts/firefox-launcher-acceptance.ts
      - scripts/firefox-owner-smoke.mjs
      - scripts/firefox-owner-bridge-smoke-runner.mjs
      - scripts/firefox-owner-smoke-manager.mjs
      - launcher.ts
      - firefox-config.ts
      - firefox-runtime.ts
      - firefox-lifecycle.ts
      - portable-profile.ts
      - session.ts
      - store.ts
      - types.ts
      - firefox-worker.mjs
      - playwright-runtime.ts
      - playwright-worker.mjs
      - agent/playwright-proxy.mjs
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: bun install --frozen-lockfile
      - name: Download verified browser
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'camoufox.zip'
          Invoke-WebRequest 'https://github.com/daijro/camoufox/releases/download/v152.0.4-beta.30/camoufox-152.0.4-beta.30-win.x86_64.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'ea52a02fb1cfb1813ef6a326bea03fb2b650c9774143d953a94a27bfc8f10072') { throw 'Camoufox archive checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'camoufox'
          Expand-Archive $archive -DestinationPath $destination
          $executables = @(Get-ChildItem -LiteralPath $destination -Recurse -File -Filter 'camoufox.exe')
          if ($executables.Count -ne 1) { throw 'Camoufox archive must contain exactly one camoufox.exe' }
          "ALIASMODE_FIREFOX_BINARY_PATH=$($executables[0].FullName)" | Add-Content $env:GITHUB_ENV
          "ALIASMODE_FIREFOX_BINARY_SHA256=$((Get-FileHash -LiteralPath $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
      - name: Prove persistent contexts, MCP, scripts, and storage
        shell: pwsh
        run: |
          $browser = $env:ALIASMODE_FIREFOX_BINARY_PATH
          node scripts/firefox-compatibility-smoke.mjs $browser (Join-Path $env:RUNNER_TEMP 'firefox-headless-proof')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/firefox-compatibility-smoke.mjs $browser (Join-Path $env:RUNNER_TEMP 'firefox-headed-proof') --headed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove detached Firefox owner lifecycle
        shell: pwsh
        run: |
          bun scripts/firefox-owner-smoke.mjs $env:ALIASMODE_FIREFOX_BINARY_PATH (Join-Path $env:RUNNER_TEMP 'firefox-owner-headless-proof')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/firefox-owner-smoke.mjs $env:ALIASMODE_FIREFOX_BINARY_PATH (Join-Path $env:RUNNER_TEMP 'firefox-owner-headed-proof') --headed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Launcher persistence and portable handoff
        shell: pwsh
        run: |
          $proof = Join-Path $env:RUNNER_TEMP "firefox-launcher-source-$([guid]::NewGuid().ToString('N'))"
          bun scripts/firefox-launcher-acceptance.ts $env:ALIASMODE_FIREFOX_BINARY_PATH $proof $env:ALIASMODE_FIREFOX_BINARY_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-compatibility-results
          path: ${{ runner.temp }}/firefox-*-proof/result.json
          if-no-files-found: ignore
