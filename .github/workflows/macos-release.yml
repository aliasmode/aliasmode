name: macOS release assets

# Adds the macOS build to a GitHub Release that the Windows pipeline already published.
# The Windows assets and their update feed are never changed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0-beta.56
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/macos-desktop.yml
    with:
      ref: ${{ inputs.tag }}
      sign: true
    secrets: inherit

  publish:
    name: Publish macOS assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The update signing key lives in this environment, which is limited to main.
    environment: windows-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: aliasmode-macos-arm64
          path: assets
      - name: Verify the release and the built files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" == "v$VERSION" ]] || { echo "tag $TAG does not match built version $VERSION"; exit 1; }
          gh release view "$TAG" --json isDraft,assets > release.json
          jq -e '.isDraft == false' release.json
          # A published asset is never replaced.
          jq -e '[.assets[].name | select(test("aarch64|macos"))] | length == 0' release.json
          cd assets
          ls -la
          test "$(ls | sort | tr '\n' ' ')" = "AliasMode_${VERSION}_aarch64.app.tar.gz AliasMode_${VERSION}_aarch64.dmg SHA256SUMS-macos.txt "
          sha256sum --check --strict SHA256SUMS-macos.txt
      - name: Sign the update archive and write the macOS update feed
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          archive="assets/AliasMode_${VERSION}_aarch64.app.tar.gz"
          bunx tauri signer sign "$archive" > /dev/null
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          pubkey="$(jq -er .plugins.updater.pubkey src-tauri/tauri.conf.json)"
          check=(cargo run --quiet --locked --manifest-path scripts/updater-signature-check/Cargo.toml --)
          "${check[@]}" "$archive" "$archive.sig" "$pubkey"
          # A changed archive must fail the same check.
          cp "$archive" corrupt.tar.gz
          printf 'x' | dd of=corrupt.tar.gz bs=1 seek=4096 conv=notrunc status=none
          if "${check[@]}" corrupt.tar.gz "$archive.sig" "$pubkey"; then
            echo "a changed archive passed the signature check"
            exit 1
          fi
          rm corrupt.tar.gz
          jq -n --arg version "$VERSION" --arg signature "$(cat "$archive.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/AliasMode_${VERSION}_aarch64.app.tar.gz" \
            '{version: $version, platforms: {"darwin-aarch64": {url: $url, signature: $signature}}}' > assets/latest-macos.json
      - name: Upload the macOS assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "assets/AliasMode_${VERSION}_aarch64.app.tar.gz" \
            "assets/AliasMode_${VERSION}_aarch64.app.tar.gz.sig" \
            "assets/AliasMode_${VERSION}_aarch64.dmg" \
            "assets/SHA256SUMS-macos.txt"
          # The feed goes last: an installed app must never read it before the archive exists.
          gh release upload "$TAG" "assets/latest-macos.json"
      - name: Verify the public downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir public
          cd public
          for name in "AliasMode_${VERSION}_aarch64.app.tar.gz" "AliasMode_${VERSION}_aarch64.dmg" SHA256SUMS-macos.txt; do
            curl --fail --silent --show-error --location --retry 3 -o "$name" "https://github.com/$GH_REPO/releases/download/$TAG/$name"
          done
          cmp SHA256SUMS-macos.txt ../assets/SHA256SUMS-macos.txt
          sha256sum --check --strict SHA256SUMS-macos.txt
          for name in "AliasMode_${VERSION}_aarch64.app.tar.gz.sig" latest-macos.json; do
            curl --fail --silent --show-error --location --retry 3 "https://github.com/$GH_REPO/releases/download/$TAG/$name" | cmp - "../assets/$name"
          done
